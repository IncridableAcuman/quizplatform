services:
  # Backend Web Service (Spring Boot 4 / Java 21)
  - type: web
    name: quiz-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-fancy-smoke-b48bmhi7-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_9dnxMWrRl3Jp
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: CORS_ALLOWED_ORIGINS
        value: https://quiz-frontend.onrender.com,https://*.onrender.com,http://localhost:5173,http://localhost:3000

  # Frontend Static Site (React + Vite)
  - type: web
    name: quiz-frontend
    runtime: static
    rootDir: quiz-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://quiz-backend.onrender.com/api/v1
